<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8b949e" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <ellipse cx="960" cy="30" rx="430" ry="230" fill="url(#glow1)"/>
  <ellipse cx="140" cy="300" rx="400" ry="210" fill="url(#glow2)"/>

  <!-- giant faded code glyph -->
  <text x="860" y="255" font-family="Consolas, 'Courier New', monospace" font-size="240" font-weight="bold" fill="#ffffff" opacity="0.03">&lt;/&gt;</text>

  <!-- terminal prompt line -->
  <text x="64" y="88" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#7ee787">~/profile $ whoami</text>

  <!-- name -->
  <text x="60" y="165" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="76" font-weight="800" fill="#e6edf3">hlgt<tspan fill="url(#accent)">520</tspan></text>

  <!-- subtitle -->
  <text x="64" y="210" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#8b949e">用代码把想法变成现实 · Build · Learn · Share</text>

  <!-- skill pills -->
  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17">
    <g>
      <rect x="920" y="62" width="210" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <circle cx="944" cy="82" r="6" fill="#00ADD8"/>
      <text x="962" y="88" fill="#c9d1d9">Go</text>
    </g>
    <g>
      <rect x="920" y="112" width="210" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <circle cx="944" cy="132" r="6" fill="#F1E05A"/>
      <text x="962" y="138" fill="#c9d1d9">JavaScript</text>
    </g>
    <g>
      <rect x="920" y="162" width="210" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <circle cx="944" cy="182" r="6" fill="#58A6FF"/>
      <text x="962" y="188" fill="#c9d1d9">HTML / CSS</text>
    </g>
    <g>
      <rect x="920" y="212" width="210" height="40" rx="20" fill="#161b22" stroke="#30363d"/>
      <circle cx="944" cy="232" r="6" fill="#3fb950"/>
      <text x="962" y="238" fill="#c9d1d9">自动化工具</text>
    </g>
  </g>

  <!-- bottom accent line -->
  <rect x="0" y="295" width="1200" height="5" fill="url(#accent)" opacity="0.9"/>
</svg>
