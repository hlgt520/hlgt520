<svg width="1500" height="420" viewBox="0 0 1500 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>

    <!-- animated gradient for the name -->
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="1400" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.33" stop-color="#bc8cff"/>
      <stop offset="0.66" stop-color="#f778ba"/>
      <stop offset="1" stop-color="#58a6ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; -450 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#58a6ff"/>
      <stop offset="0.6" stop-color="#bc8cff"/>
      <stop offset="0.85" stop-color="#f778ba"/>
      <stop offset="1" stop-color="#f778ba" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bc8cff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#bc8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f778ba" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#f778ba" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8b949e" opacity="0.07"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1500" height="420" fill="url(#bg)"/>
  <rect width="1500" height="420" fill="url(#dots)"/>

  <!-- drifting aurora glows -->
  <ellipse cx="330" cy="110" rx="360" ry="190" fill="url(#glowBlue)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 25; 0 0" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1210" cy="90" rx="380" ry="200" fill="url(#glowPurple)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -70 30; 0 0" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="760" cy="420" rx="420" ry="200" fill="url(#glowPink)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 45 -25; 0 0" dur="22s" repeatCount="indefinite"/>
  </ellipse>

  <!-- twinkling stars -->
  <g fill="#e6edf3">
    <circle cx="90"  cy="60"  r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="180" r="1.2"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="55"  r="1.4"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="120" r="1.1"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="5s"   repeatCount="indefinite"/></circle>
    <circle cx="640" cy="70"  r="1.5"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="50"  r="1.3"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="130" r="1.2"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="65" r="1.6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="5.3s" repeatCount="indefinite"/></circle>
    <circle cx="1290" cy="160" r="1.1"><animate attributeName="opacity" values="0.3;0.85;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1420" cy="80" r="1.4"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="60"  cy="320" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="260" r="1.1"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1330" cy="280" r="1.4"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1450" cy="340" r="1.2"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="30" r="1.2"><animate attributeName="opacity" values="0.25;0.8;0.25" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="380" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="385" r="1.2"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="4.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- intro code line -->
  <text x="750" y="140" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="21" fill="#8b949e">const greeting = <tspan fill="#a5d6ff">"Hello, World!"</tspan>;</text>

  <!-- name with animated gradient -->
  <text x="750" y="252" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="112" font-weight="800" fill="url(#nameGrad)" letter-spacing="2">hlgt520</text>

  <!-- subtitle -->
  <text x="750" y="312" text-anchor="middle" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#8b949e">后端开发 · 自动化工具 · 用代码解决实际问题</text>

  <!-- accent mini line -->
  <text x="750" y="352" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#58a6ff">Go ✦ JavaScript ✦ Web ✦ Automation</text>

  <!-- bottom accent -->
  <rect x="0" y="416" width="1500" height="4" fill="url(#accent)"/>
</svg>
